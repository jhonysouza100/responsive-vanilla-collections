<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== FAVICON ===============-->
      <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">

      <!--=============== SAKURA CSS ===============-->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura-js@1.1.1/dist/sakura.min.css">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="styles.css">

      <title>Responsive Temple Website</title>
   </head>
   <body>
      <!--==================== HEADER ====================-->
      <header class="header" id="header">
         <nav class="nav container">
            <a href="#" class="nav_logo">
               <i class="ri-ancient-gate-line"></i>
               <span>Temple</span>
            </a>

            <div class="nav_menu" id="nav-menu">
               <ul class="nav_list">
                  <li><a href="#" class="nav_link">Home</a></li>
                  <li><a href="#" class="nav_link">Location</a></li>
                  <li><a href="#" class="nav_link">About</a></li>
                  <li><a href="#" class="nav_link">Explore</a></li>
                  <li><a href="#" class="nav_link">Contact</a></li>
               </ul>

               <!-- Close button -->
                <div class="nav_close" id="nav-close">
                  <i class="ri-close-large-line"></i>
                </div>
            </div>

            <!-- Toggle button -->
             <div class="nav_toggle" id="nav-toggle">
               <i class="ri-apps-2-line"></i>
             </div>
         </nav>
      </header>

      <!--==================== MAIN ====================-->
      <main class="main">
         <!--==================== HOME ====================-->
         <section class="home">
            <img src="/public/img-bg.svg" alt="image" class="home_bg">
            <div class="home_container container">
               <div class="home_data">
                  <h1 class="home_title">Welcome To <br> Temple</h1>
                  <p class="home_description">
                     The temple is an attractive taourist place where you could visit and connect to the pure land of the enviroment, you will experience peace and harmony.
                  </p>
                  <a href="#" class="home_button">Explore Place</a>
                  <img src="/public/lantern-1.svg" alt="Image" class="home_lantern-1">
                  <img src="/public/lantern-2.svg" alt="Image" class="home_lantern-2">
               </div>
               <div class="home_images">
                  <img src="/public/img-1.svg" alt="Image" class="home_img-1">
                  <img src="/public/img-2.svg" alt="Image" class="home_img-2">
                  <img src="/public/img-3.svg" alt="Image" class="home_img-3">
                  <img src="/public/img-4.svg" alt="Image" class="home_img-4">
                  <img src="/public/img-5.svg" alt="Image" class="home_img-5">
                  <img src="/public/img-6.svg" alt="Image" class="home_img-6">
               </div>
            </div>
         </section>
      </main>

      <!-- Sakura petals -->
      <div class="sakura-petals"></div>
      
      <!--=============== GSAP ===============-->
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

      <!--=============== SAKURA JS ===============-->
      <script src="https://cdn.jsdelivr.net/npm/sakura-js@1.1.1/dist/sakura.min.js"></script>
      
      <!--=============== MAIN JS ===============-->
      <script src="script.js"></script>
   </body>
</html>
